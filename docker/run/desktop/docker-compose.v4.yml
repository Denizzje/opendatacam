version: "2.3"
services:
  opendatacam:
    restart: always
    runtime: nvidia
    image: opendatacam/opendatacam:v3.0.2-desktop
    privileged: true
    volumes:
      - './config.json:/var/local/opendatacam/config.json'
    ports:
      - "8080:8080"
      - "8070:8070"
      - "8090:8090"
    depends_on:
      - mongo
      - inference-sidecar
  inference-sidecar:
    build:
      context: ../../..
      dockerfile: services/inference-sidecar/Dockerfile
    restart: always
    environment:
      - SIDECAR_PORT=9080
    ports:
      - "9080:9080"
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_container:/data/db
volumes:
  mongodb_data_container:
