version: "2.3"
services:
  opendatacam:
    restart: always
    image: opendatacam/opendatacam:development-cpu-amd64
    privileged: true
    environment:
      - INFERENCE_SIDECAR_URL=http://inference-sidecar:9080
      - OPENDATACAM_V2_USE_SIDECAR_DETECTIONS=true
      - OPENDATACAM_V2_MJPEG_FALLBACK_LEGACY=false
    volumes:
      - './config.json:/var/local/opendatacam/config.json'
    ports:
      - "8080:8080"
      - "8070:8070"
      - "8090:8090"
    depends_on:
      - mongo
      - inference-sidecar
  inference-sidecar:
    build:
      context: ../../..
      dockerfile: services/inference-sidecar/Dockerfile
    restart: always
    environment:
      - SIDECAR_PORT=9080
      - SIDECAR_ENABLE_DARKHELP=true
      - SIDECAR_DARKHELP_CFG=/opt/models/model.cfg
      - SIDECAR_DARKHELP_WEIGHTS=/opt/models/model.weights
      - SIDECAR_DARKHELP_NAMES=/opt/models/model.names
      - SIDECAR_VIDEO_SOURCE=/opt/video/input.mp4
      - SIDECAR_VIDEO_LOOP=true
      - SIDECAR_EMIT_DEMO_DETECTIONS=false
      - MJPEG_STREAM_INTERVAL_MS=100
      - SIDECAR_MJPEG_QUALITY=80
    volumes:
      - './models:/opt/models:ro'
      - './videos:/opt/video:ro'
    ports:
      - "9080:9080"
  mongo:
    image: mongo:4.4.8
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_container:/data/db
volumes:
  mongodb_data_container:
